name: Release

on:
  push:
    branches:
      - main

permissions:
  id-token: write

jobs:
  publish:
    name: Publish if version changed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Update npm
        run: npm install -g npm@latest

      - name: Fix .npmrc for OIDC
        run: |
          NPMRC="$(npm config get userconfig)"
          if [ -f "$NPMRC" ]; then
            sed -i 's|//registry.npmjs.org/:_authToken=.*||' "$NPMRC"
          fi

      - name: Check version on npm
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if npm view "vshot@$CURRENT" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.exists == 'false'
        run: npm publish --provenance --access public